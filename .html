<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Ilon</title>
<style>
  :root { --bg:#0b0c1a; --neon:#00f5d4; --pink:#ff2e93; --yellow:#ffd60a; }
  * { box-sizing: border-box; margin:0; padding:0; }
  body {
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: radial-gradient(circle at 50% 20%, #1b1e4b, var(--bg) 70%);
    font-family: "Segoe UI", system-ui, sans-serif; color:#fff; gap:16px; padding:16px;
  }
  h1 { font-size:2rem; letter-spacing:4px; color:var(--neon); text-shadow:0 0 10px var(--neon), 0 0 30px var(--neon); }
  .hud { display:flex; gap:24px; font-size:1.1rem; }
  .hud b { color:var(--yellow); text-shadow:0 0 8px var(--yellow); }
  .wrap { position:relative; }
  canvas {
    border:2px solid var(--neon); border-radius:12px; background:#07081a;
    box-shadow:0 0 20px var(--neon), inset 0 0 30px rgba(0,245,212,.15);
    max-width:100%; touch-action:none;
  }
  .overlay {
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(7,8,26,.8); border-radius:12px; text-align:center; gap:12px; backdrop-filter: blur(3px);
  }
  .overlay.hidden { display:none; }
  .overlay h2 { color:var(--pink); text-shadow:0 0 14px var(--pink); font-size:1.8rem; }
  button {
    background:transparent; color:var(--neon); border:2px solid var(--neon); padding:10px 28px;
    font-size:1rem; border-radius:999px; cursor:pointer; transition:.2s; letter-spacing:2px;
  }
  button:hover { background:var(--neon); color:#000; box-shadow:0 0 20px var(--neon); }
  .pad { display:grid; grid-template-columns:repeat(3,56px); gap:8px; }
  .pad button { padding:0; height:56px; border-radius:12px; font-size:1.3rem; }
  .pad .up { grid-column:2; } .pad .left { grid-column:1; grid-row:2; }
  .pad .down { grid-column:2; grid-row:2; } .pad .right { grid-column:3; grid-row:2; }
  small { opacity:.6; }
</style>
</head>
<body>
  <h1>NEON ILON</h1>
  <div class="hud">
    <div>Ball: <b id="score">0</b></div>
    <div>Rekord: <b id="best">0</b></div>
  </div>
  <div class="wrap">
    <canvas id="game" width="420" height="420"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="title">Tayyormisiz?</h2>
      <p id="msg">Strelkalar yoki WASD bilan boshqaring</p>
      <button id="start">BOSHLASH</button>
    </div>
  </div>
  <div class="pad">
    <button class="up" data-d="up">▲</button>
    <button class="left" data-d="left">◀</button>
    <button class="down" data-d="down">▼</button>
    <button class="right" data-d="right">▶</button>
  </div>
  <small>Probel — pauza</small>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const titleEl = document.getElementById('title');
const msgEl = document.getElementById('msg');

const SIZE = 21, CELL = canvas.width / SIZE;
let snake, dir, nextDir, food, score, speed, timer, running, particles = [];
let best = +localStorage.getItem('neonSnakeBest') || 0;
bestEl.textContent = best;

function reset() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0}; nextDir = dir;
  score = 0; speed = 130; particles = [];
  scoreEl.textContent = 0;
  placeFood();
}

function placeFood() {
  do {
    food = {x: Math.floor(Math.random()*SIZE), y: Math.floor(Math.random()*SIZE)};
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function burst(x, y, color) {
  for (let i = 0; i < 18; i++) {
    const a = Math.random() * Math.PI * 2, v = 1 + Math.random() * 3;
    particles.push({x:(x+.5)*CELL, y:(y+.5)*CELL, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:1, color});
  }
}

function start() {
  reset();
  overlay.classList.add('hidden');
  running = true;
  clearInterval(timer);
  timer = setInterval(tick, speed);
}

function setSpeed() {
  clearInterval(timer);
  timer = setInterval(tick, speed);
}

function gameOver() {
  running = false;
  clearInterval(timer);
  if (score > best) {
    best = score;
    try { localStorage.setItem('neonSnakeBest', best); } catch(e) {}
    bestEl.textContent = best;
  }
  titleEl.textContent = "O'yin tugadi!";
  msgEl.textContent = `Natijangiz: ${score}`;
  document.getElementById('start').textContent = 'QAYTA O\'YNASH';
  overlay.classList.remove('hidden');
}

function tick() {
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (head.x < 0 || head.y < 0 || head.x >= SIZE || head.y >= SIZE ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    burst(snake[0].x, snake[0].y, '#ff2e93');
    draw();
    return gameOver();
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = score;
    burst(food.x, food.y, '#ffd60a');
    placeFood();
    if (speed > 60) { speed -= 4; setSpeed(); }
  } else {
    snake.pop();
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // grid
  ctx.strokeStyle = 'rgba(0,245,212,.06)';
  ctx.lineWidth = 1;
  for (let i = 1; i < SIZE; i++) {
    ctx.beginPath(); ctx.moveTo(i*CELL, 0); ctx.lineTo(i*CELL, canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i*CELL); ctx.lineTo(canvas.width, i*CELL); ctx.stroke();
  }

  // food (pulsing)
  const pulse = 0.7 + 0.3 * Math.sin(Date.now() / 150);
  ctx.shadowBlur = 20; ctx.shadowColor = '#ff2e93';
  ctx.fillStyle = '#ff2e93';
  ctx.beginPath();
  ctx.arc((food.x+.5)*CELL, (food.y+.5)*CELL, CELL*.35*pulse + 2, 0, Math.PI*2);
  ctx.fill();

  // snake
  snake.forEach((s, i) => {
    const t = 1 - i / snake.length;
    ctx.shadowBlur = i === 0 ? 25 : 10;
    ctx.shadowColor = '#00f5d4';
    ctx.fillStyle = i === 0 ? '#ffffff' : `hsl(${170 - i*3}, 100%, ${35 + t*25}%)`;
    const pad = i === 0 ? 1 : 2;
    ctx.beginPath();
    ctx.roundRect(s.x*CELL + pad, s.y*CELL + pad, CELL - pad*2, CELL - pad*2, 6);
    ctx.fill();
  });

  // particles
  ctx.shadowBlur = 0;
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.life -= 0.03;
    ctx.globalAlpha = Math.max(p.life, 0);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 3, 3);
  });
  ctx.globalAlpha = 1;
  particles = particles.filter(p => p.life > 0);
}

function loop() { if (snake) draw(); requestAnimationFrame(loop); }
reset(); loop();

function turn(d) {
  const map = {up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0}};
  const n = map[d];
  if (n && !(n.x === -dir.x && n.y === -dir.y)) nextDir = n;
}

document.addEventListener('keydown', e => {
  const keys = {ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};
  if (keys[e.key]) { e.preventDefault(); turn(keys[e.key]); }
  if (e.code === 'Space' && snake && overlay.classList.contains('hidden') !== undefined) {
    e.preventDefault();
    if (running) {
      running = false; clearInterval(timer);
      titleEl.textContent = 'Pauza'; msgEl.textContent = 'Davom etish uchun tugmani bosing';
      document.getElementById('start').textContent = 'DAVOM ETISH';
      overlay.classList.remove('hidden'); overlay.dataset.paused = '1';
    }
  }
});

document.querySelectorAll('.pad button').forEach(b =>
  b.addEventListener('click', () => turn(b.dataset.d)));

document.getElementById('start').addEventListener('click', () => {
  if (overlay.dataset.paused) {
    delete overlay.dataset.paused;
    overlay.classList.add('hidden');
    running = true; setSpeed();
  } else start();
});

// swipe
let sx, sy;
canvas.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; });
canvas.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 'right' : 'left'); else turn(dy > 0 ? 'down' : 'up');
});
</script>
</body>
</html>
